<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/profile.css">
</head>
<body class="app-shell">
<nav class="sidebar">
    <div class="px-3 mb-4 text-center">
        <h4 class="navbar-brand text-white mb-1"><span class="brand-icon"><i class="fas fa-satellite-dish"></i></span> SmartCampus SecureNet</h4>
        <p class="small mb-0 sidebar-subtitle">Network Monitoring</p>
    </div>
    <ul class="nav flex-column px-2">
        <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a></li>
        <li class="nav-item"><a href="devices.html" class="nav-link"><i class="fas fa-server me-2"></i> Devices</a></li>
        <li class="nav-item"><a href="topology.html" class="nav-link"><i class="fas fa-project-diagram me-2"></i> Topology Map</a></li>
        <li class="nav-item"><a href="alerts.html" class="nav-link"><i class="fas fa-bell me-2"></i> Alerts</a></li>
        <li class="nav-item"><a href="reports.html" class="nav-link"><i class="fas fa-chart-bar me-2"></i> Reports</a></li>
        <li class="nav-item"><a href="profile.html" class="nav-link active"><i class="fas fa-user me-2"></i> Profile</a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fas fa-gear me-2"></i> Settings</a></li>
        <li class="nav-item mt-4"><a href="#" class="nav-link text-danger" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
    </ul>
</nav>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<nav class="navbar navbar-expand-lg top-navbar"><div class="container-fluid"><button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span class="navbar-toggler-icon"></span></button><h5 class="mb-0 text-secondary" id="page-title">Profile</h5></div></nav>
<div class="main-content">
    <h5 class="section-heading">Administrator Profile</h5>
    <div class="row g-3">
        <div class="col-12 col-lg-4">
            <div class="card panel-card p-4 text-center">
                <img src="https://i.pinimg.com/736x/71/3b/91/713b91f71ff4f5c11366ec5a052bdb11.jpg" class="rounded-circle mx-auto mb-3" width="96" alt="Administrator avatar">
                <h6 class="mb-1">Campus Net Admin</h6>
                <p class="text-muted mb-2">Network Operations Lead</p>
                <span class="status-pill justify-content-center"><i class="fas fa-circle"></i> Active Session</span>
            </div>
        </div>
        <div class="col-12 col-lg-8">
            <div class="card panel-card p-4">
                <h6 class="section-title">Profile Information</h6>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" value="Campus Net Admin"></div>
                    <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" value="admin@icbuilding.local"></div>
                    <div class="col-md-6"><label class="form-label">Contact Number</label><input type="text" class="form-control" value="+63 900 000 0000"></div>
                    <div class="col-md-6"><label class="form-label">Role</label><input type="text" class="form-control" value="System Administrator"></div>
                    <div class="col-12"><button class="btn btn-primary" type="button">Save Profile</button></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
