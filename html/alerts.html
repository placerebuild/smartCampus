<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/alerts.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid"><button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Alerts</h5>
        </div>
    </nav>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="section-heading mb-0">Alert History</h5>
            <button class="btn btn-outline-secondary btn-sm" onclick="exportAlertsCSV()">
                <i class="fas fa-download me-1"></i>Export CSV
            </button>
        </div>
        <div class="card panel-card p-3">
            <table class="table table-hover" id="alerts-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Device</th>
                        <th>Issue</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Resolution Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <!-- View Resolution Notes Modal -->
    <div class="modal fade" id="viewNotesModal" tabindex="-1" aria-labelledby="viewNotesModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-secondary-subtle text-secondary rounded-circle p-2">
                <i class="fas fa-clipboard-check"></i>
              </span>
              <h6 class="modal-title fw-semibold mb-0" id="viewNotesModalLabel">Resolution Notes</h6>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-2">
            <p class="text-muted small mb-3" id="view-notes-device"></p>
            <div class="bg-light rounded p-3" style="white-space:pre-wrap;min-height:80px;font-size:.9rem" id="view-notes-body"></div>
            <p class="text-muted small mt-2 mb-0">Resolved by: <strong id="view-notes-resolver"></strong></p>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Resolve Alert Modal -->
    <div class="modal fade" id="resolveAlertModal" tabindex="-1" aria-labelledby="resolveAlertModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-success-subtle text-success rounded-circle p-2">
                <i class="fas fa-check-circle"></i>
              </span>
              <h6 class="modal-title fw-semibold mb-0" id="resolveAlertModalLabel">Resolve Alert</h6>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-2">
            <p class="text-muted small mb-3" id="resolve-modal-device-info"></p>
            <label for="resolution-notes-input" class="form-label fw-medium">
              Resolution Notes <span class="text-muted fw-normal">(optional)</span>
            </label>
            <textarea id="resolution-notes-input" class="form-control" rows="4"
              placeholder="Describe what was done to fix the issue — e.g. replaced cable, rebooted switch, updated firmware…"
              maxlength="2000"></textarea>
            <div class="d-flex justify-content-between mt-1">
              <small class="text-muted">Leave blank if no notes are needed.</small>
              <small class="text-muted"><span id="notes-char-count">0</span>/2000</small>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-success btn-sm" id="confirm-resolve-btn">
              <i class="fas fa-check me-1"></i>Mark as Resolved
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/monitoring.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
