<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topology | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/styles/vis-network.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/topology.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Topology Map</h5>
        </div>
    </nav>
    <div class="main-content">
        <h5 class="section-heading">Network Topology Map</h5>
        <p class="text-muted topology-help">Logical campus map with live device status and connection paths.</p>

        <div class="card panel-card p-3 mb-3 topology-toolbar">
            <div class="row g-2 align-items-end">
                <div class="col-12 col-md-3">
                    <label for="topology-view-mode" class="form-label mb-1">View Mode</label>
                    <select id="topology-view-mode" class="form-select">
                        <option value="logical" selected>Topology Map (Logical)</option>
                        <option value="hierarchy">Hierarchy View</option>
                        <option value="floor">Floor-based Map</option>
                        <option value="realtime">Real-time Map</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label for="building-filter" class="form-label mb-1">Building Zone</label>
                    <select id="building-filter" class="form-select">
                        <option value="all" selected>All Buildings</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label for="status-filter" class="form-label mb-1">Operational Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="all">All Statuses</option>
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                        <option value="Warning">Warning</option>
                    </select>
                </div>
                <div class="col-12 col-md-3 d-grid">
                    <button id="reset-topology-btn" class="btn btn-outline-primary">Reset Map View</button>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-12 col-xl-8">
                <div class="topology-map-shell">
                    <div id="network" class="topology-container" aria-label="Campus topology map"></div>
                    <div id="topology-empty-state" class="topology-empty-state active">
                        <span class="empty-icon"><i class="fas fa-project-diagram"></i></span>
                        <h6 class="mb-1">Awaiting topology data</h6>
                        <p class="mb-0">Connect to the scanner or import link data to render the logical map.</p>
                    </div>
                </div>
                <div class="topology-legend mt-3">
                    <span class="legend-item"><span class="legend-dot online"></span> Online</span>
                    <span class="legend-item"><span class="legend-dot warning"></span> Warning</span>
                    <span class="legend-item"><span class="legend-dot offline"></span> Offline</span>
                </div>
            </div>
            <div class="col-12 col-xl-4">
                <div class="card panel-card p-3 topology-detail-card">
                    <h6 class="section-title mb-2">Device Details</h6>
                    <p class="text-muted mb-3">Select a device on the map to inspect its metadata and links.</p>
                    <div id="topology-device-details" class="small"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/monitoring.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
