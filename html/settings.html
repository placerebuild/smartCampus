<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/settings.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid"><button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Settings</h5>
        </div>
    </nav>
    <div class="main-content">
        <h5 class="section-heading">System Settings</h5>
        <div class="card panel-card p-4 mb-3">
            <h6 class="section-title">Monitoring Preferences</h6>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Scan Interval</label><select class="form-select">
                        <option>Every 1 minute</option>
                        <option selected>Every 5 minutes</option>
                        <option>Every 10 minutes</option>
                        <option>Every 30 minutes</option>
                    </select></div>
                <div class="col-md-6"><label class="form-label">Alert Threshold</label><select class="form-select">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                        <option>Critical Only</option>
                    </select></div>
                <div class="col-12">
                    <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox"
                            id="emailAlertSwitch" checked><label class="form-check-label" for="emailAlertSwitch">Enable
                            email alerts</label></div>
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox"
                            id="soundAlertSwitch" checked><label class="form-check-label" for="soundAlertSwitch">Enable
                            sound notifications</label></div>
                </div>
            </div>
        </div>
        <div class="card panel-card p-4">
            <h6 class="section-title">Security</h6>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Current Password</label><input type="password"
                        class="form-control" placeholder="Enter current password"></div>
                <div class="col-md-6"><label class="form-label">New Password</label><input type="password"
                        class="form-control" placeholder="Enter new password"></div>
                <div class="col-12"><button class="btn btn-primary" type="button">Update Settings</button></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
