<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SmartCampus SecureNet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="brand-section">
            <img src="../images/transparent_logo.png" alt="DNSC Logo" class="auth-logo">
            <h2 class="system-title"><i class="fas fa-satellite-dish me-2" style="color: #1ecc83;"></i>SmartCampus</h2>
            <p class="system-subtitle">SecureNet</p>
        </div>

        <h4 class="text-center mb-4 text-dark font-weight-bold" style="font-family: 'Sora', sans-serif;">Welcome Back</h4>

        <form action="index.html" method="GET">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="admin@dnsc.edu.ph" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label d-flex justify-content-between">
                    Password
                    <a href="#" class="text-decoration-none small" style="color: #158a47;">Forgot?</a>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">Keep me signed in</label>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-divider">
            <span>or</span>
        </div>

        <div class="auth-links">
            Don't have an account? <a href="signup.html">Create one now</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
