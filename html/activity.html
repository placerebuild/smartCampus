<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log | SmartCampus SecureNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/devices.css">
</head>

<body class="sidebar-layout">
    <script>window.pageRequiredRole = 'Admin';</script>
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Activity Log</h5>
        </div>
    </nav>
    <div class="main-content">
        <h5 class="section-heading">Activity Log</h5>
        <p class="text-muted mb-3">Audit trail of all significant actions performed in the system.</p>

        <div class="card panel-card p-3 mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-sm-4">
                    <label class="form-label small text-muted">Filter by action</label>
                    <select class="form-select form-select-sm" id="actionFilter">
                        <option value="">All actions</option>
                        <option value="login">Login</option>
                        <option value="logout">Logout</option>
                        <option value="user_registered">User Registered</option>
                        <option value="device_deleted">Device Deleted</option>
                        <option value="device_updated">Device Updated</option>
                        <option value="alert_resolved">Alert Resolved</option>
                        <option value="settings_changed">Settings Changed</option>
                        <option value="discovery_scan">Discovery Scan</option>
                        <option value="user_role_changed">Role Changed</option>
                        <option value="user_deleted">User Deleted</option>
                    </select>
                </div>
                <div class="col-sm-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadActivityLogs(true)">
                        <i class="fas fa-sync-alt me-1"></i>Refresh
                    </button>
                </div>
            </div>
        </div>

        <div class="card panel-card p-3">
            <div id="activity-error" class="alert alert-danger d-none"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle table-sm" id="activity-table">
                    <thead class="table-light">
                        <tr>
                            <th>Date / Time</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Details</th>
                            <th>IP Address</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin me-2"></i>Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-sm btn-outline-secondary d-none" id="loadMoreBtn" onclick="loadMore()">
                    <i class="fas fa-chevron-down me-1"></i>Load More
                </button>
                <p class="text-muted small mt-2 mb-0" id="activity-count"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/activity.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
