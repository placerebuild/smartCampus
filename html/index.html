<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Campus Net Monitor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>

    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="d-flex align-items-center w-100">
                <h5 class="mb-0 text-secondary" id="page-title">Dashboard</h5>
                <div class="ms-auto me-lg-3 me-2 search-wrap">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="form-control search-input" placeholder="Search devices or IP...">
                </div>
                <div class="d-flex align-items-center">
                    <span class="me-3 status-pill"><i class="fas fa-circle"></i></span>
                    <div class="dropdown">
                        <button class="btn dropdown-toggle d-flex align-items-center user-menu-btn"
                            data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-2"></i><span id="navUserName">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="hero-panel mb-4">
            <div>
                <p class="hero-eyebrow mb-1">IC Building Network Devices</p>
                <h3 class="hero-title mb-1">Network Health</h3>
                <p class="hero-subtitle mb-0">Monitor core services, reduce downtime, and keep everything connected.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="stat-label">Total Devices</h6>
                            <h2 class="mb-0 stat-value" id="total-devices">--</h2>
                        </div><span class="stat-icon stat-icon-primary"><i class="fas fa-network-wired"></i></span>
                    </div><small class="text-success stat-note"></small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="stat-label">Online</h6>
                            <h2 class="mb-0 text-success stat-value" id="online-count">--</h2>
                        </div><span class="stat-icon stat-icon-success"><i class="fas fa-check-circle"></i></span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="stat-label">Offline</h6>
                            <h2 class="mb-0 text-danger stat-value" id="offline-count">--</h2>
                        </div><span class="stat-icon stat-icon-danger"><i class="fas fa-times-circle"></i></span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="stat-label">Alerts Today</h6>
                            <h2 class="mb-0 text-warning stat-value" id="alerts-today">--</h2>
                        </div><span class="stat-icon stat-icon-warning"><i class="fas fa-bell"></i></span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-8">
                <div class="card p-4 panel-card">
                    <h6 class="section-title">Device Chart</h6><canvas id="statusChart" height="300"></canvas>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="card p-4 panel-card">
                    <h6 class="section-title">Recent Alerts</h6>
                    <ul class="list-group list-group-flush" id="recent-alerts"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/monitoring.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
