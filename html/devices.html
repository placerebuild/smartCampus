<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/devices.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Devices</h5>
        </div>
        
    </nav>
    <div class="main-content">

        <!-- Hero banner -->
        <div class="devices-hero mb-4">
            <div class="devices-hero-text">
                <div class="devices-hero-eyebrow">Network Inventory</div>
                <h4 class="devices-hero-title">Device Inventory</h4>
                <p class="devices-hero-sub mb-0">All discovered campus network devices — monitored in real time via ICMP ping and SNMP.</p>
            </div>
            <div class="devices-hero-right">
                <div class="devices-hero-stats">
                    <div class="dstat-pill">
                        <span class="dstat-value" id="dv-total">--</span>
                        <span class="dstat-label">Total</span>
                    </div>
                    <div class="dstat-pill dstat-online">
                        <span class="dstat-value" id="dv-online">--</span>
                        <span class="dstat-label">Online</span>
                    </div>
                    <div class="dstat-pill dstat-offline">
                        <span class="dstat-value" id="dv-offline">--</span>
                        <span class="dstat-label">Offline</span>
                    </div>
                </div>
                <div class="dv-filter-wrap">
                    <button class="dv-filter-btn active" id="dv-filter-today" title="Show only devices detected today">
                        <i class="fas fa-calendar-day me-1"></i>Today
                    </button>
                    <button class="dv-filter-btn" id="dv-filter-all" title="Show all devices">
                        <i class="fas fa-list me-1"></i>All Devices
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-2 px-1">
            <span class="text-muted small" id="dv-table-count"></span>
        </div>

        <div class="card panel-card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="devices-table">
                    <thead class="table-light">
                        <tr>
                            <th>Device Name</th>
                            <th>Type</th>
                            <th>IP Address</th>
                            <th>MAC Address</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Last Seen</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="dv-table-toggle-row" class="text-center pt-2 pb-1 border-top" style="display:none;">
                <button id="dv-table-toggle-btn" class="btn btn-sm btn-outline-secondary px-4">Show All</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/monitoring.js"></script>
    <script src="../js/live-scan.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
