<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices | Campus Net Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/devices.css">
</head>

<body class="sidebar-layout">
    <div id="sidebar-container"></div>
    <nav class="navbar navbar-expand-lg top-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><span
                    class="navbar-toggler-icon"></span></button>
            <h5 class="mb-0 text-secondary" id="page-title">Devices</h5>
        </div>
    </nav>
    <div class="main-content">
        <h5 class="section-heading">Device Inventory</h5>
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <p class="text-muted mb-0">(temporary scanning button for testing)</p>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#deviceScanModal">
                <i class="fas fa-radar me-2"></i>Scan Device
            </button>
        </div>
        <div class="card panel-card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="devices-table">
                    <thead class="table-light">
                        <tr>
                            <th>Device Name</th>
                            <th>Type</th>
                            <th>IP Address</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Last Seen</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deviceScanModal" tabindex="-1" aria-labelledby="deviceScanLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border:none;border-radius:16px;overflow:hidden;">
                <div class="modal-header" style="background:#f4f8fd;">
                    <h5 class="modal-title" id="deviceScanLabel" style="font-family:'Sora',sans-serif;">Scan Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="deviceScanForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="scanIp">IP Address</label>
                            <input class="form-control" id="scanIp" name="scanIp" type="text" placeholder="192.168.1.1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="scanName">Device Name (optional)</label>
                            <input class="form-control" id="scanName" name="scanName" type="text" placeholder="Globe GFiber Modem">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="scanType">Device Type</label>
                            <select class="form-select" id="scanType" name="scanType">
                                <option value="Gateway">Gateway</option>
                                <option value="Router">Router</option>
                                <option value="Switch">Switch</option>
                                <option value="Wi-Fi AP">Wi-Fi AP</option>
                                <option value="Server">Server</option>
                                <option value="PC">PC</option>
                                <option value="Printer">Printer</option>
                                <option value="Camera">Camera</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="scanLocation">Location (optional)</label>
                            <input class="form-control" id="scanLocation" name="scanLocation" type="text" placeholder="IC Building - Lab">
                        </div>
                        <div class="small text-muted" id="scanStatusMessage">Provide an IP address to add a device.</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="scanSubmitBtn">Scan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/script.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
