<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SmartCampus SecureNet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
        <div class="brand-section mb-3">
            <img src="../images/transparent_logo-Picsart-BackgroundRemover.png" alt="DNSC Logo" class="auth-logo" style="max-height: 80px;">
            <h2 class="system-title"><i class="fas fa-satellite-dish me-2" style="color: #1ecc83;"></i>SmartCampus</h2>
            <p class="system-subtitle">SecureNet</p>
        </div>

        <h4 class="text-center mb-4 text-dark font-weight-bold" style="font-family: 'Sora', sans-serif;">Create an Account</h4>

        <form action="login.html" method="GET">
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="John" required>
                </div>
                <div class="col-sm-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="admin@dnsc.edu.ph" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="Create a strong password" required>
                </div>
                <div class="form-text mt-1 text-muted small">Must be at least 8 characters long.</div>
            </div>

            <button type="submit" class="auth-btn">Register Account</button>
        </form>

        <div class="auth-links mt-4">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
